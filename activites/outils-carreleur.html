<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Les outils du carreleur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout : en-tête avec 2 modes (Découvrir / Quel outil pour… ?), grille 6x2 d'outils à toucher, panneau réponse. Pensé pour TNI. */
:root{--bg:#f3f5f8;--surface:#ffffff;--ink:#14223a;--muted:#56637a;--line:#d6dce6;--plan:#123a6b;--plan-ink:#eaf1fb;--accent:#e8711a;--accent-ink:#ffffff;--ok:#1f8a4c;--ok-bg:#e3f4ea;--ko:#b8322a;--ko-bg:#fbe7e5;--chip:#e7ecf3;--tile:#ffffff;
--f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1522;--surface:#172234;--ink:#e7edf6;--muted:#9aa8bd;--line:#2a3850;--plan:#0b2747;--plan-ink:#dce8f8;--accent:#f08a3a;--accent-ink:#1a0f05;--ok:#5fd193;--ok-bg:#12321f;--ko:#ff8a80;--ko-bg:#3a1714;--chip:#22314a;--tile:#f4f6f9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1522;--surface:#172234;--ink:#e7edf6;--muted:#9aa8bd;--line:#2a3850;--plan:#0b2747;--plan-ink:#dce8f8;--accent:#f08a3a;--accent-ink:#1a0f05;--ok:#5fd193;--ok-bg:#12321f;--ko:#ff8a80;--ko-bg:#3a1714;--chip:#22314a;--tile:#f4f6f9;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px}
.wrap{max-width:1280px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-display);margin:0;line-height:1.02;text-transform:uppercase;text-wrap:balance}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.tags{display:flex;gap:6px;margin-bottom:6px}
.tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:4px;background:var(--chip);color:var(--muted)}
.tag.lvl{background:var(--plan);color:var(--plan-ink)}
h1{font-size:clamp(34px,5vw,54px)}
.modes{display:flex;gap:8px}
.mode{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 18px;font-weight:700;font-size:19px}
.mode[aria-pressed="true"]{background:var(--plan);color:var(--plan-ink);border-color:var(--plan)}
.panel{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;min-height:120px}
.panel .txt{flex:1;min-width:0}
.panel h2{font-size:clamp(28px,3.4vw,40px)}
.panel p{margin:6px 0 0;font-size:22px}
.fam{display:inline-block;margin-top:8px;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.speak,.nextq{display:inline-flex;gap:8px;align-items:center;border:0;background:var(--plan);color:var(--plan-ink);border-radius:8px;padding:12px 18px;font-weight:700;font-size:18px}
.nextq{background:var(--accent);color:var(--accent-ink)}
.score{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:16px}
.tool{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--tile);border:3px solid var(--line);border-radius:12px;padding:10px 8px 12px;color:#14223a;min-width:0}
.tool svg{width:100%;max-width:130px;height:auto;aspect-ratio:1}
.tool img{width:100%;max-width:170px;height:auto;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.tool .nm{font-weight:700;font-size:16px;text-align:center;min-height:2.6em;display:flex;align-items:center}
.quiz .tool .nm{visibility:hidden}
.tool[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.tool.good{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}
.tool.bad{border-color:var(--ko);background:var(--ko-bg)}
.quiz .tool.good .nm{visibility:visible}
@media (prefers-reduced-motion:no-preference){.tool.bad{animation:sh .4s}.tool{transition:border-color .15s,box-shadow .15s}}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb-ok{color:var(--ok)} .fb-ko{color:var(--ko)}
@media (max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:repeat(3,1fr)}.tool .nm{font-size:13px}}
</style>
<div class="wrap">
  <div class="head">
    <div><div class="tags"><a class="tag" href="../metier.html?m=carreleur" style="text-decoration:none">← Carreleur mosaïste</a><span class="tag lvl">4e</span><span class="tag">TNI</span></div><h1>Les outils du carreleur</h1></div>
    <div class="modes" role="group" aria-label="Mode">
      <button class="mode" id="m-dec" aria-pressed="true">Découvrir</button>
      <button class="mode" id="m-quiz" aria-pressed="false">Quel outil pour… ?</button>
    </div>
  </div>
  <div class="panel" aria-live="polite">
    <div class="txt" id="txt"></div>
    <div id="side" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"></div>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
const T=[{"id":"peigne","n":"Le peigne (spatule crantée)","u":"Étaler la colle en sillons réguliers.","f":"Préparer et poser","svg":"<path d=\"M30 100 H170 V150 H164 V136 H156 V150 H144 V136 H136 V150 H124 V136 H116 V150 H104 V136 H96 V150 H84 V136 H76 V150 H64 V136 H56 V150 H44 V136 H36 V150 H30 Z\" fill=\"#c7cdd4\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"78\" y=\"40\" width=\"44\" height=\"60\" rx=\"10\" fill=\"#e8711a\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>"},{"id":"truelle","n":"La truelle langue de chat","u":"Prendre la colle et la déposer sur le support.","f":"Préparer et poser","svg":"<path d=\"M40 165 L120 85 L165 60 L140 105 Z\" fill=\"#c7cdd4\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M120 85 L110 60 L80 30\" fill=\"none\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"52\" y=\"12\" width=\"26\" height=\"46\" rx=\"8\" transform=\"rotate(-45 65 35)\" fill=\"#e8711a\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>"},{"id":"malaxeur","n":"Le malaxeur","u":"Mélanger la colle ou le joint avec la perceuse.","f":"Préparer et poser","svg":"<path d=\"M100 20 V110\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M100 110 C60 115 60 135 100 140 C140 145 140 165 100 170 C60 175 70 185 100 185\" fill=\"none\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M100 110 C140 115 140 135 100 140 C60 145 60 165 100 170\" fill=\"none\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-opacity=\".5\"/><rect x=\"88\" y=\"14\" width=\"24\" height=\"16\" fill=\"#c7cdd4\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>"},{"id":"niveau","n":"Le niveau à bulle","u":"Vérifier que la pose est bien horizontale ou verticale.","f":"Mesurer et contrôler","svg":"<rect x=\"15\" y=\"80\" width=\"170\" height=\"40\" rx=\"6\" fill=\"#f2b84b\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"75\" y=\"88\" width=\"50\" height=\"24\" rx=\"12\" fill=\"#9fd0ee\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"100\" r=\"7\" fill=\"#ffffff\" stroke=\"#14223a\" stroke-width=\"3\"/><path d=\"M90 88v24M110 88v24\" stroke=\"#14223a\" stroke-width=\"3\"/>"},{"id":"regle","n":"La règle de carreleur","u":"Vérifier que les carreaux sont bien plans, tracer des lignes.","f":"Mesurer et contrôler","svg":"<rect x=\"10\" y=\"85\" width=\"180\" height=\"30\" rx=\"4\" fill=\"#c7cdd4\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M10 100 H190\" stroke=\"#14223a\" stroke-width=\"3\" stroke-opacity=\".5\"/><rect x=\"85\" y=\"92\" width=\"30\" height=\"16\" rx=\"8\" fill=\"#ffffff\" stroke=\"#14223a\" stroke-width=\"3\"/>"},{"id":"metre","n":"Le mètre ruban","u":"Mesurer les longueurs avant de poser ou de couper.","f":"Mesurer et contrôler","svg":"<rect x=\"20\" y=\"60\" width=\"90\" height=\"90\" rx=\"22\" fill=\"#f2b84b\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"65\" cy=\"105\" r=\"16\" fill=\"#ffffff\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M110 132 H185 V148 H110\" fill=\"#ffffff\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M125 132v8M140 132v12M155 132v8M170 132v12\" stroke=\"#14223a\" stroke-width=\"3\"/><path d=\"M185 132 v24\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>"},{"id":"croisillons","n":"Les croisillons","u":"Garder des joints de la même largeur entre les carreaux.","f":"Préparer et poser","svg":"<g fill=\"#ffffff\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M50 35h16v24h24v16H66v24H50V75H26V59h24z\"/><path d=\"M130 75h16v24h24v16h-24v24h-16v-24h-24V99h24z\"/><path d=\"M60 125h12v18h18v12H72v18H60v-18H42v-12h18z\"/></g>"},{"id":"maillet","n":"Le maillet en caoutchouc","u":"Taper sur le carreau pour bien l'enfoncer dans la colle, sans le casser.","f":"Préparer et poser","svg":"<rect x=\"30\" y=\"40\" width=\"140\" height=\"56\" rx=\"12\" fill=\"#2a2f38\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"30\" y=\"40\" width=\"40\" height=\"56\" rx=\"12\" fill=\"#ffffff\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"88\" y=\"96\" width=\"24\" height=\"90\" rx=\"8\" fill=\"#e8711a\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>"},{"id":"coupe","n":"Le coupe-carreau","u":"Couper les carreaux en ligne droite.","f":"Couper","svg":"<rect x=\"10\" y=\"130\" width=\"180\" height=\"26\" rx=\"4\" fill=\"#c7cdd4\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M24 130 V96 M176 130 V96 M20 96 H180\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"100\" y=\"86\" width=\"22\" height=\"20\" fill=\"#ffffff\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"111\" cy=\"116\" r=\"8\" fill=\"#ffffff\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M111 86 L70 30\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"52\" y=\"14\" width=\"26\" height=\"30\" rx=\"8\" transform=\"rotate(-35 65 29)\" fill=\"#e8711a\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>"},{"id":"pince","n":"La pince perroquet","u":"Grignoter le carreau pour faire des coupes arrondies.","f":"Couper","svg":"<path d=\"M80 70 C70 40 95 20 115 30 L100 80 Z\" fill=\"#c7cdd4\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M120 70 C130 40 105 20 85 30 L100 80 Z\" fill=\"#c7cdd4\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"100\" cy=\"82\" r=\"8\" fill=\"#ffffff\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M95 88 L55 180 M105 88 L145 180\" stroke=\"#e8711a\" stroke-width=\"16\" stroke-linecap=\"round\"/><path d=\"M95 88 L55 180 M105 88 L145 180\" stroke=\"#14223a\" stroke-width=\"3\" fill=\"none\"/>"},{"id":"raclette","n":"La raclette à joint","u":"Faire pénétrer le joint entre les carreaux.","f":"Faire les joints","svg":"<rect x=\"25\" y=\"110\" width=\"150\" height=\"40\" rx=\"6\" fill=\"#2a2f38\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><rect x=\"25\" y=\"96\" width=\"150\" height=\"16\" rx=\"4\" fill=\"#c7cdd4\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><path d=\"M70 96 C70 50 130 50 130 96\" fill=\"none\" stroke=\"#e8711a\" stroke-width=\"16\"/><path d=\"M70 96 C70 50 130 50 130 96\" fill=\"none\" stroke=\"#14223a\" stroke-width=\"3\"/>"},{"id":"eponge","n":"L'éponge","u":"Nettoyer et lisser le joint, enlever le surplus.","f":"Faire les joints","svg":"<rect x=\"30\" y=\"60\" width=\"140\" height=\"80\" rx=\"22\" fill=\"#f2b84b\" stroke=\"#14223a\" stroke-width=\"6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><g fill=\"#14223a\" fill-opacity=\".35\"><circle cx=\"60\" cy=\"85\" r=\"6\"/><circle cx=\"95\" cy=\"78\" r=\"5\"/><circle cx=\"130\" cy=\"90\" r=\"7\"/><circle cx=\"75\" cy=\"115\" r=\"5\"/><circle cx=\"115\" cy=\"118\" r=\"6\"/><circle cx=\"150\" cy=\"112\" r=\"4\"/></g>"}];
/* Outils qui ont une vraie photo dans img/outils/carreleur/. Les autres gardent leur dessin en attendant. */
const PHOTO=["peigne", "truelle", "malaxeur", "niveau", "regle", "metre", "croisillons", "maillet"];
let mode='dec',sel=null,q=[],qi=0,pts=0,tried=false;
const grid=document.getElementById('grid'),txt=document.getElementById('txt'),side=document.getElementById('side');
const spk='<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 7h3l4-4v12l-4-4H2z" fill="currentColor"/><path d="M12 6a4 4 0 0 1 0 6M14 3.5a7 7 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
function say(s){try{const u=new SpeechSynthesisUtterance(s);u.lang='fr-FR';u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function drawGrid(){grid.className='grid'+(mode==='quiz'?' quiz':'');grid.innerHTML=T.map((t,i)=>'<button class="tool" data-i="'+i+'" aria-pressed="'+(sel===i)+'" aria-label="'+(mode==='quiz'?'Outil '+(i+1):t.n)+'">'+(PHOTO.includes(t.id)?'<img src="../img/outils/carreleur/'+t.id+'.jpg" alt="" loading="lazy">':'<svg viewBox="0 0 200 200" aria-hidden="true">'+t.svg+'</svg>')+'<span class="nm">'+t.n+'</span></button>').join('')}
function decPanel(){
  if(sel===null){txt.innerHTML='<h2>Touche un outil</h2><p>Tu découvres son nom et à quoi il sert.</p>';side.innerHTML='';return}
  const t=T[sel];txt.innerHTML='<h2>'+t.n+'</h2><p>'+t.u+'</p><span class="fam">'+t.f+'</span>';
  side.innerHTML='<button class="speak" id="sp">'+spk+'Écouter</button>';document.getElementById('sp').onclick=()=>say(t.n+'. '+t.u);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function quizPanel(msg){
  if(qi>=q.length){txt.innerHTML='<h2>Terminé : '+pts+' / '+q.length+'</h2><p>'+(pts>=10?'Excellent, tu connais les outils du carreleur !':pts>=7?'Bien joué. Revois les outils où tu as hésité.':'Continue à t\'entraîner avec le mode Découvrir.')+'</p>';
    side.innerHTML='<button class="nextq" id="again">Rejouer</button>';document.getElementById('again').onclick=startQuiz;return}
  const t=T[q[qi]];
  txt.innerHTML='<span class="fam">Question '+(qi+1)+' / '+q.length+'</span><h2>Quel outil pour…</h2><p>'+t.u.replace(/\.$/,'')+' ?</p>'+(msg||'');
  side.innerHTML='<button class="speak" id="sp">'+spk+'Écouter</button><span class="score">'+pts+' pt'+(pts>1?'s':'')+'</span>';
  document.getElementById('sp').onclick=()=>say('Quel outil pour : '+t.u);
}
function startQuiz(){q=shuffle(T.map((_,i)=>i));qi=0;pts=0;tried=false;sel=null;drawGrid();quizPanel()}
grid.onclick=e=>{const b=e.target.closest('.tool');if(!b)return;const i=+b.dataset.i;
  if(mode==='dec'){sel=i;drawGrid();decPanel();return}
  if(qi>=q.length)return;
  if(i===q[qi]){if(!tried)pts++;b.classList.add('good');
    quizPanel('<p class="fb-ok"><strong>Oui ! '+T[i].n+'.</strong></p>');
    side.insertAdjacentHTML('beforeend','<button class="nextq" id="nx">Question suivante</button>');
    document.getElementById('nx').onclick=()=>{qi++;tried=false;drawGrid();quizPanel()};
  }else{tried=true;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');
    const fb=txt.querySelector('.fb-ko')||txt.appendChild(Object.assign(document.createElement('p'),{className:'fb-ko'}));fb.innerHTML='<strong>Non, ce n\'est pas cet outil. Essaie encore.</strong>'}
};
function setMode(m){mode=m;document.getElementById('m-dec').setAttribute('aria-pressed',m==='dec');document.getElementById('m-quiz').setAttribute('aria-pressed',m==='quiz');
  if(m==='dec'){sel=null;drawGrid();decPanel()}else startQuiz()}
document.getElementById('m-dec').onclick=()=>setMode('dec');document.getElementById('m-quiz').onclick=()=>setMode('quiz');
setMode('dec');
</script>
</body>
</html>
