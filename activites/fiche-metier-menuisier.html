<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le menuisier · Fiche métier au TNI</title>
<meta name="description" content="La fiche métier du menuisier à projeter au TNI : une question à la classe, puis les réponses apparaissent une par une.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Diapo TNI « ping-pong », style Atelier du site.
   Chaque chapitre s'ouvre sur un écran-question plein cadre (encre + jaune). Au clic, la question se range en bandeau
   et les cartes-réponses « ? » apparaissent ; chaque réponse dévoilée passe d'abord en grand au centre puis se range.
   Étapes et EPI : grand panneau photo + frise de vignettes. Tenon et mortaise : dessin en perspective animé.
   Scène fixe 1280x720 mise à l'échelle de l'écran. */
:root{
  --encre:#101828; --encre-2:#1D2638; --bleu:#1F4FD1; --bleu-f:#1A3FA8; --bleu-pale:#E8EEFF; --jaune:#FFC928; --rouge:#E0442F;
  --blanc:#FFFFFF; --papier:#F7F8FB; --gris:#3E4A5C; --gris-2:#6B7587;
  --f-titre:"Bricolage Grotesque","Arial Black",Arial,sans-serif;
  --f-txt:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
  --ease:cubic-bezier(.7,0,.2,1); --sortie:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#E9ECF2;color:var(--encre);font-family:var(--f-txt);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid var(--bleu);outline-offset:3px}
h1,h2,h3{font-family:var(--f-titre);font-weight:800;letter-spacing:-.03em;line-height:.98;margin:0}
mark{background:var(--jaune);color:var(--encre);padding:0 .14em;border-radius:.12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}

.vue{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;position:relative}
.scene{width:1280px;height:720px;flex:none;transform-origin:center center;position:relative;overflow:hidden;border-radius:16px;background:var(--blanc);box-shadow:0 0 0 3px var(--encre),12px 12px 0 3px var(--encre)}
.diapo{position:absolute;inset:0;overflow:hidden;background:var(--blanc);
  background-image:linear-gradient(rgba(16,24,40,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(16,24,40,.045) 1px,transparent 1px);background-size:32px 32px}
.diapo[hidden]{display:none}

/* Volet de changement de chapitre */
.volet{position:absolute;inset:0;z-index:60;pointer-events:none;visibility:hidden}
.volet i{position:absolute;inset:0;transform:translateX(-101%)}
.volet .v1{background:var(--jaune)}
.volet .v2{background:var(--encre);display:flex;align-items:center;justify-content:center}
.volet .v2 b{font-family:var(--f-titre);font-weight:800;font-size:260px;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:3px var(--jaune);line-height:1}

/* Mots qui montent */
.mo{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.mo>span{display:inline-block}

/* ---------- Couverture ---------- */
.couv{background-color:var(--jaune)}
.couv .tag{position:absolute;left:64px;top:56px;display:inline-flex;gap:12px;align-items:center;background:var(--encre);color:var(--blanc);border-radius:999px;padding:10px 22px;font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.couv .tag::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--jaune)}
.couv .le{position:absolute;left:64px;top:250px;font-family:var(--f-titre);font-weight:700;font-size:56px;letter-spacing:-.02em}
.couv h1{position:absolute;left:58px;top:300px;font-size:164px;letter-spacing:-.055em;line-height:.9}
.couv .accroche{position:absolute;left:66px;top:470px;font-size:32px;line-height:1.3;max-width:20ch}
.couv .go{position:absolute;left:64px;bottom:52px;display:inline-flex;align-items:center;gap:14px;background:var(--blanc);border:3px solid var(--encre);border-radius:999px;padding:12px 26px 12px 14px;font-weight:700;font-size:22px;box-shadow:5px 5px 0 var(--encre)}
.couv .go kbd{background:var(--encre);color:var(--jaune);border-radius:999px;padding:4px 14px;font-family:var(--f-txt);font-size:18px}
.couv .heros{position:absolute;right:64px;top:48px;width:470px;height:588px;border:4px solid var(--encre);border-radius:22px;overflow:hidden;box-shadow:14px 14px 0 var(--encre);transform:rotate(2deg);background:#ddd}
.couv .heros img{width:100%;height:100%;object-fit:cover;display:block}
.couv .vignette{position:absolute;width:168px;height:168px;border:3px solid var(--encre);border-radius:16px;overflow:hidden;background:#fff;box-shadow:6px 6px 0 var(--encre)}
.couv .vignette img{width:100%;height:100%;object-fit:cover;display:block}
.couv .vg1{right:470px;top:430px;transform:rotate(-7deg)}
.couv .vg2{right:40px;top:520px;transform:rotate(6deg)}

/* ---------- Chapitres : écran-question puis bandeau ---------- */
.qbar{position:absolute;left:0;right:0;top:0;height:100%;background:var(--encre);color:var(--blanc);z-index:20;display:flex;flex-direction:column;justify-content:center;padding:0 90px;transition:height .8s var(--ease),padding .8s var(--ease);cursor:pointer}
.qbar .grand{position:absolute;right:56px;bottom:-40px;font-family:var(--f-titre);font-weight:800;font-size:420px;line-height:1;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:3px rgba(255,201,40,.55);transition:opacity .5s,transform .8s var(--ease);pointer-events:none}
.qbar .rub{display:flex;align-items:center;gap:14px;font-weight:700;font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:var(--jaune);transition:font-size .8s var(--ease)}
.qbar .rub b{display:grid;place-items:center;min-width:46px;height:46px;padding:0 8px;border-radius:12px;background:var(--jaune);color:var(--encre);font-family:var(--f-titre);font-size:26px;letter-spacing:0;transition:all .8s var(--ease)}
.qbar h2{font-size:84px;line-height:1.02;margin-top:22px;max-width:15.5em;transition:font-size .8s var(--ease),margin .8s var(--ease);position:relative}
.qbar .aide{font-size:32px;color:#C9D2E3;margin-top:22px;transition:font-size .8s var(--ease),margin .8s var(--ease),opacity .4s;position:relative}
.qbar .touche{position:absolute;left:90px;bottom:44px;font-size:20px;color:#8C97AB;transition:opacity .3s}
.qbar .touche kbd{border:2px solid #4A556B;border-radius:8px;padding:2px 10px;color:#fff;font-family:var(--f-txt);margin:0 4px}
.dock .qbar{height:150px;padding:0 48px;cursor:default}
.dock .qbar .grand{opacity:0;transform:translateX(120px)}
.dock .qbar .rub{font-size:17px}
.dock .qbar .rub b{min-width:34px;height:34px;font-size:20px;border-radius:9px}
.dock .qbar h2{font-size:38px;margin-top:10px;max-width:none}
.dock .qbar .aide{font-size:21px;margin-top:0;opacity:0;height:0}
.dock .qbar .touche{opacity:0}
.qbar.sans-aide .aide{display:none}

.zone{position:absolute;left:48px;right:48px;top:178px;bottom:32px;opacity:0;transform:translateY(40px);transition:opacity .6s .25s,transform .8s .2s var(--sortie);pointer-events:none}
.dock .zone{opacity:1;transform:none;pointer-events:auto}
.ombre{position:absolute;inset:-200px -80px -60px;background:rgba(16,24,40,.72);opacity:0;pointer-events:none;z-index:30}

/* ---------- Cartes-réponses ---------- */
.carte{position:relative;border-radius:20px;background:var(--blanc);border:3px solid var(--encre);box-shadow:8px 8px 0 var(--encre);min-height:0}
.carte .slot{position:absolute;inset:-3px;border-radius:20px;border:3px dashed rgba(16,24,40,.38);background:var(--papier);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:calc(100% + 6px);height:calc(100% + 6px);z-index:3;transition:opacity .25s,background .2s}
.carte .slot:hover{background:var(--bleu-pale);border-color:var(--bleu)}
.carte .slot .pi{font-family:var(--f-titre);font-weight:800;font-size:84px;line-height:.9;color:var(--bleu)}
.carte .slot .lab{font-size:19px;font-weight:700;color:var(--gris-2);letter-spacing:.08em;text-transform:uppercase}
.carte:not(.vu){box-shadow:none;border-color:transparent;background:transparent}
.carte:not(.vu) .ct{visibility:hidden}
.carte.vu .slot{opacity:0;pointer-events:none}
.carte.vole{z-index:40}

.ct{position:absolute;inset:0;border-radius:17px;overflow:hidden;display:flex;flex-direction:column}
.ct .txt{padding:24px 28px;display:flex;flex-direction:column;gap:12px;flex:1;justify-content:flex-end}
.ct .idx{font-family:var(--f-titre);font-weight:800;font-size:22px;color:var(--bleu);letter-spacing:.02em}
.ct h3{font-size:50px}
.ct p{margin:0;font-size:28px;line-height:1.25;color:var(--gris)}
.ct .trait{height:8px;width:0;background:var(--jaune);border-radius:4px;transition:width .6s .3s var(--sortie)}
.vu .ct .trait{width:96px}
.ct .photo{position:relative;flex:1;min-height:0;border-bottom:3px solid var(--encre);background:#ddd}
.ct .photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Variantes de couleur (cartes affiche) */
.c-bleu .ct{background:var(--bleu);color:var(--blanc)} .c-bleu .ct p{color:#DCE5FF} .c-bleu .ct .idx{color:var(--jaune)}
.c-encre .ct{background:var(--encre);color:var(--blanc)} .c-encre .ct p{color:#C9D2E3} .c-encre .ct .idx{color:var(--jaune)}
.c-jaune .ct{background:var(--jaune)} .c-jaune .ct p{color:var(--encre)} .c-jaune .ct .trait{background:var(--encre)}
.c-rouge .ct{background:var(--rouge);color:var(--blanc)} .c-rouge .ct p{color:#FFE3DD} .c-rouge .ct .idx{color:var(--encre)} .c-rouge .ct .trait{background:var(--encre)}
.ct .fil{position:absolute;right:18px;top:-24px;font-family:var(--f-titre);font-weight:800;font-size:230px;line-height:1;letter-spacing:-.06em;-webkit-text-fill-color:transparent;-webkit-text-stroke:3px currentColor;opacity:.3;pointer-events:none}

/* Grilles par chapitre */
.g-objets{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1.25fr 1fr;gap:22px;height:100%}
.g-objets .large{grid-column:1/-1}
.g-objets .large .txt{justify-content:center;padding:22px 34px}
.phrase{font-family:var(--f-titre);font-weight:700;font-size:40px;line-height:1.15;letter-spacing:-.02em;color:var(--encre)}
.famille{font-size:24px;color:var(--gris)}
.g-objets .ct h3{font-size:56px}
.g-objets .ct h3 small{display:block;font-family:var(--f-txt);font-weight:700;font-size:22px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;opacity:.75}

.g-ou{display:grid;grid-template-columns:1fr 1fr .95fr;grid-template-rows:1fr 1fr;gap:22px;height:100%}
.g-ou .haut{grid-row:1/3}
.g-ou .haut .photo{flex:1.25}
.g-ou .haut .txt{flex:0 0 auto;padding:18px 24px 22px;gap:8px}
.g-ou .haut h3{font-size:42px}
.g-ou .haut p{font-size:25px}
.g-ou .petit h3{font-size:40px}
.g-ou .petit p{font-size:25px}

.g-comment{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:22px;height:100%}
.g-comment .photo{flex:1.1}
.g-comment .txt{flex:0 0 auto}
.g-comment h3{font-size:42px}
.g-comment p{font-size:26px}
.g-comment .affiche .txt{flex:1}

.g-qual{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:22px;height:100%}
.g-qual h3{font-size:54px;text-transform:uppercase;letter-spacing:-.04em}
.g-qual p{font-size:28px}

.g-form{display:grid;grid-template-columns:1fr 90px 1fr;align-items:stretch;height:100%}
.g-form .fleche{display:grid;place-items:center}
.g-form .fleche svg{width:70px;height:70px}
.g-form h3{font-size:46px}
.g-form .ct .txt{justify-content:center;gap:16px}
.g-form .badge{align-self:flex-start;background:var(--encre);color:var(--jaune);border-radius:999px;padding:6px 18px;font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.c-bleu .badge{background:var(--jaune);color:var(--encre)}

/* ---------- Panneau + frise (étapes, EPI) ---------- */
.focus{display:grid;grid-template-rows:1fr 132px;gap:22px;height:100%}
.panneau{position:relative;border:3px solid var(--encre);border-radius:22px;background:var(--blanc);box-shadow:8px 8px 0 var(--encre);overflow:hidden}
.panneau .vide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--gris-2);font-size:28px;background:var(--papier)}
.panneau .vide b{font-family:var(--f-titre);font-size:110px;line-height:.9;color:var(--bleu)}
.panneau .plein{position:absolute;inset:0;display:grid;grid-template-columns:336px 1fr;gap:40px;align-items:center;padding:0 40px 0 0}
.panneau .ph{height:100%;border-right:3px solid var(--encre);background:#E5E7EB;overflow:hidden;position:relative}
.panneau .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.panneau .etq{display:inline-flex;align-items:center;gap:12px;font-weight:700;font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:var(--bleu)}
.panneau .etq b{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--bleu);color:#fff;font-family:var(--f-titre);font-size:26px;letter-spacing:0}
.panneau h3{font-size:60px;margin-top:12px}
.panneau p{font-size:31px;line-height:1.28;margin:16px 0 0;color:var(--gris);max-width:24em}
.panneau .outil{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;margin-top:22px;padding-top:18px;border-top:3px dashed #CBD2DE;font-size:28px}
.panneau .outil b{background:var(--jaune);padding:2px 12px;border-radius:8px;font-size:30px}
.panneau .alerte{display:inline-flex;align-items:center;gap:12px;margin-top:22px;background:var(--rouge);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700;font-size:28px}
.panneau.danger{border-color:var(--rouge);box-shadow:8px 8px 0 var(--rouge)}

.frise{display:grid;grid-template-columns:repeat(6,1fr);gap:22px}
.tuile{position:relative;border-radius:16px;border:3px solid var(--encre);background:var(--blanc);box-shadow:5px 5px 0 var(--encre);overflow:visible;padding:0;transition:transform .25s var(--sortie),box-shadow .25s}
.tuile .im{position:absolute;inset:0;border-radius:13px;overflow:hidden;background:#E5E7EB}
.tuile .im img{width:100%;height:100%;object-fit:cover;display:block}
.tuile .nom{position:absolute;left:0;right:0;bottom:0;background:var(--encre);color:#fff;font-weight:700;font-size:19px;padding:6px 8px;text-align:center;border-radius:0 0 13px 13px}
.tuile .n{position:absolute;left:-12px;top:-12px;width:38px;height:38px;border-radius:50%;background:var(--bleu);color:#fff;border:3px solid var(--encre);display:grid;place-items:center;font-family:var(--f-titre);font-weight:800;font-size:20px;z-index:2}
.tuile .slot{position:absolute;inset:-3px;border-radius:16px;border:3px dashed rgba(16,24,40,.38);background:var(--papier);display:grid;place-items:center;font-family:var(--f-titre);font-weight:800;font-size:56px;color:var(--bleu);z-index:3}
.tuile .slot:hover{background:var(--bleu-pale);border-color:var(--bleu)}
.tuile:not(.vu){box-shadow:none;border-color:transparent}
.tuile:not(.vu) .n{display:none}
.tuile.vu .slot{display:none}
.tuile.actif{transform:translateY(-8px);box-shadow:5px 13px 0 var(--jaune),0 0 0 5px var(--jaune)}
.frise.suite .tuile:not(:last-child)::after{content:"";position:absolute;right:-19px;top:50%;width:12px;height:12px;border-top:4px solid var(--encre);border-right:4px solid var(--encre);transform:translateY(-50%) rotate(45deg)}

/* ---------- Tenon / mortaise ---------- */
.g-mots{display:grid;grid-template-columns:690px 1fr;gap:28px;height:100%}
.dessin{position:relative;border:3px solid var(--encre);border-radius:22px;background:var(--papier);box-shadow:8px 8px 0 var(--encre);overflow:hidden;
  background-image:linear-gradient(rgba(31,79,209,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(31,79,209,.08) 1px,transparent 1px);background-size:24px 24px}
.dessin svg{position:absolute;inset:0;width:100%;height:100%}
.dessin .attente{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-titre);font-weight:800;font-size:150px;color:rgba(31,79,209,.18);transition:opacity .4s}
.dessin.d1 .attente,.dessin.d2 .attente,.dessin.d3 .attente{opacity:0}
.defs{display:grid;grid-template-rows:repeat(3,1fr);gap:20px}
.defs .ct .txt{justify-content:center;gap:6px;padding:16px 24px}
.defs h3{font-size:40px;color:var(--bleu)}
.defs .idx,.defs .trait{display:none}
.defs p{font-size:25px;line-height:1.2;color:var(--encre)}
.g-rail,.g-montant,.lab{transition:transform 1.2s var(--ease),opacity .6s}
.g-rail{opacity:0;transform:translate(0,-50px)}
.g-montant{opacity:0;transform:translate(0,40px)}
.d-rail .g-rail{opacity:1;transform:none}
.d-montant .g-montant{opacity:1;transform:none}
.d-asm .g-rail{transform:translate(var(--asx),var(--asy))}
.tenon polygon{transition:fill-opacity .6s .55s,stroke-dasharray .1s .55s}
.d-asm .tenon polygon{fill-opacity:.28;stroke-dasharray:9 7}
.lab{opacity:0}
.d-rail .lab-tenon{opacity:1}
.d-montant .lab-mort{opacity:1}
.d-asm .lab-mort{opacity:0}
.d-asm .lab-tenon{opacity:0}
.d-asm .lab-asm{opacity:1}

/* ---------- Fin ---------- */
.fin{background-color:var(--bleu);color:#fff;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px)}
.fin h1{position:absolute;left:72px;top:120px;font-size:170px;letter-spacing:-.055em;color:#fff}
.fin h1 span{color:var(--jaune)}
.fin .consigne{position:absolute;left:78px;top:340px;font-size:36px;line-height:1.35;max-width:21ch}
.fin .consigne b{color:var(--jaune)}
.fin .indice{position:absolute;left:78px;bottom:64px;display:inline-flex;gap:14px;align-items:center;background:var(--jaune);color:var(--encre);border:3px solid var(--encre);border-radius:16px;padding:14px 22px;font-size:26px;font-weight:700;box-shadow:6px 6px 0 var(--encre)}
.fin .heros{position:absolute;right:70px;top:70px;width:420px;height:525px;border:4px solid var(--encre);border-radius:22px;overflow:hidden;box-shadow:14px 14px 0 var(--encre);transform:rotate(-2deg)}
.fin .heros img{width:100%;height:100%;object-fit:cover}

/* ---------- Barre de commande ---------- */
.barre{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:var(--blanc);border-top:3px solid var(--encre)}
.barre .b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border:3px solid var(--encre);border-radius:12px;background:var(--blanc);font-weight:700;font-size:18px;text-decoration:none;box-shadow:3px 3px 0 var(--encre);transition:transform .1s}
.barre .b:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--encre)}
.barre .b.suiv{background:var(--bleu);color:#fff;font-size:21px;padding:0 26px;min-width:250px}
.barre .b.prec{font-size:22px;width:58px;padding:0}
.barre .vide{flex:1}
.barre .chap{font-family:var(--f-titre);font-weight:700;font-size:19px;color:var(--gris);max-width:330px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.points{display:flex;gap:6px}
.points i{width:13px;height:13px;border-radius:50%;border:2px solid var(--encre);background:var(--blanc);transition:all .3s}
.points i.ok{background:var(--encre)}
.points i.ici{background:var(--jaune);transform:scale(1.35)}
@media (max-width:900px){.barre .opt,.points,.barre .chap{display:none}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>
<main class="vue" id="vue"><div class="scene" id="scene">
  <div class="volet" id="volet"><i class="v1"></i><i class="v2"><b id="voletNum">01</b></i></div>
</div></main>

<nav class="barre" aria-label="Commandes">

/* Dessin en perspective : une traverse couchée avec sa mortaise (dessus), un montant avec son tenon (dessous) */
function dessinTenon(){
  const c=Math.cos(Math.PI/6),sn=.5;
  const P=(x,y,z)=>[((x-z)*c).toFixed(1),((x+z)*sn-y).toFixed(1)];
  const pts=a=>a.map(p=>p.join(',')).join(' ');
  const poly=(a,fill,extra)=>'<polygon points="'+pts(a)+'" fill="'+fill+'" stroke="#101828" stroke-width="3" stroke-linejoin="round" '+(extra||'')+'/>';
  const boite=(x0,y0,z0,dx,dy,dz,col)=>{const x1=x0+dx,y1=y0+dy,z1=z0+dz;
    return poly([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],col[0])
      +poly([P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],col[1])
      +poly([P(x1,y0,z0),P(x1,y0,z1),P(x1,y1,z1),P(x1,y1,z0)],col[2]);};
  const ligne=(a,b)=>'<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#B98A50" stroke-width="2.5" stroke-linecap="round"/>';
  const BOIS=['#F6DDB5','#E9BE83','#CF9A5E'], JAUNE=['#FFE38A','#FFC928','#E0A800'];
  const g=80; // hauteur du montant au-dessus avant assemblage
  // Traverse couchée : x 0..320, y 0..70, z 0..100 ; mortaise sur le dessus : x 125..195, z 35..65
  let m=boite(0,0,0,320,70,100,BOIS);
  for(const y of [18,36,54]) m+=ligne(P(12,y,100),P(308,y,100));
  const trou=[P(125,70,35),P(195,70,35),P(195,70,65),P(125,70,65)];
  m+='<clipPath id="cpTrou"><polygon points="'+pts(trou)+'"/></clipPath>'+poly(trou,'#2A1C10');
  m+='<g clip-path="url(#cpTrou)">'+poly([P(125,70,35),P(125,70,65),P(125,0,65),P(125,0,35)],'#7A5634','stroke-width="1.5"')+poly([P(125,70,35),P(195,70,35),P(195,0,35),P(125,0,35)],'#4E3620','stroke-width="1.5"')+'</g>'+poly(trou,'none');
  // Montant : x 110..210, z 15..85, y 70+g+60 .. +150 ; tenon : x 130..190, z 38..62, 60 de long vers le bas
  const yb=70+g;
  let r='<g class="tenon">'+boite(125,yb,35,70,70,30,JAUNE)+'</g>'+boite(105,yb+70,10,110,110,80,BOIS);
  for(const x of [124,148,172,196]) r+=ligne(P(x,yb+82,90),P(x,yb+168,90));
  const tT=P(160,yb+35,65), tM=P(160,70,50);
  const etiq=(cls,x,y,txt,f,fond,coul)=>{const w=txt.length*21+40;
    return '<g class="lab '+cls+'"><line x1="'+f[0]+'" y1="'+f[1]+'" x2="'+(x+w/2)+'" y2="'+y+'" stroke="#101828" stroke-width="3"/><circle cx="'+f[0]+'" cy="'+f[1]+'" r="7" fill="#101828" stroke="#fff" stroke-width="2"/>'
    +'<rect x="'+(x-w/2)+'" y="'+(y-26)+'" width="'+w+'" height="52" rx="12" fill="'+fond+'" stroke="#101828" stroke-width="3"/><text x="'+x+'" y="'+(y+11)+'" text-anchor="middle" font-family="Bricolage Grotesque, Arial Black, sans-serif" font-weight="800" font-size="31" fill="'+coul+'">'+txt+'</text></g>';};
  const labT=etiq('lab-tenon',-140,-120,'TENON',tT,'#FFC928','#101828');
  const labM=etiq('lab-mort',-150,40,'MORTAISE',tM,'#FFFFFF','#101828');
  const labA='<g class="lab lab-asm"><rect x="-245" y="-262" width="470" height="58" rx="14" fill="#101828"/><text x="-10" y="-223" text-anchor="middle" font-family="Bricolage Grotesque, Arial Black, sans-serif" font-weight="800" font-size="31" fill="#FFC928">Ça tient, sans une vis !</text></g>';
  return '<svg viewBox="-262 -282 552 500" aria-label="Dessin d’un assemblage à tenon et mortaise" style="--asx:0px;--asy:'+g+'px">'
    +'<g class="g-montant">'+m+'</g><g class="g-rail">'+r+'</g>'+labM+labT+labA+'</svg>';
}

/* Projecteur : la carte dévoilée arrive en grand au centre, puis rejoint sa place */
function projecteur(c,ombre){
  const sr=scene.getBoundingClientRect(),r=c.getBoundingClientRect();
  const x=(r.left-sr.left)/S,y=(r.top-sr.top)/S,w=r.width/S,h=r.height/S;
  const dx=640-(x+w/2),dy=380-(y+h/2),k=Math.max(1,Math.min(1.9,860/w,470/h));
  const T='translate('+dx+'px,'+dy+'px) ';
  c.classList.add('vole');
  const a=c.animate([
    {transform:T+'scale('+(k*.55)+')',opacity:0,easing:'cubic-bezier(.2,.8,.2,1)'},
    {transform:T+'scale('+k+')',opacity:1,offset:.17,easing:'linear'},
    {transform:T+'scale('+k+')',opacity:1,offset:.66,easing:'cubic-bezier(.7,0,.2,1)'},
    {transform:'none',opacity:1}],{duration:2500});
  ombre.animate([{opacity:0},{opacity:1,offset:.15},{opacity:1,offset:.64},{opacity:0}],{duration:2500});
  a.onfinish=a.oncancel=()=>c.classList.remove('vole');
  C_ANIM=a;
}
let C_ANIM=null;

/* ======================= NAVIGATION ======================= */
let i=0, occupe=false;
const pts=document.getElementById('points');
DIAPOS.forEach(()=>pts.appendChild(document.createElement('i')));
function echelle(){const r=vue.getBoundingClientRect();S=Math.min((r.width-36)/1280,(r.height-36)/720);scene.style.transform='scale('+S+')'}
addEventListener('resize',echelle);

function dock(C,on){C.docked=on;C.s.classList.toggle('dock',on);
  if(on&&!RM)apparait([...C.s.querySelectorAll('.zone .carte,.zone .tuile,.zone .panneau,.zone .dessin,.zone .fleche')],500,60,30);}
function devoiler(C,k,spot){
  if(C_ANIM&&C_ANIM.playState==='running')C_ANIM.finish();
  if(!C.docked){dock(C,true);C.ordre.push('dock')}
  const it=C.items[k];if(it.el.classList.contains('vu')){if(C.voir)C.voir(k);return}
  C.ordre.push(k);it.montrer(spot&&C.d.type==='grille'&&C.docked);maj();
}
function suivant(){
  if(occupe)return;const C=ctl[i];
  if(C_ANIM&&C_ANIM.playState==='running'){C_ANIM.finish();return}
  if(C.intro&&!C.docked){dock(C,true);C.ordre.push('dock');return maj()}
  const k=C.items.findIndex(x=>!x.el.classList.contains('vu'));
  if(k>=0)return devoiler(C,k,true);
  aller(i+1);
}
function precedent(){
  if(occupe)return;const C=ctl[i];
  if(C_ANIM&&C_ANIM.playState==='running')C_ANIM.finish();
  const z=C.ordre.pop();
  if(z==='dock'){dock(C,false);return maj()}
  if(z!=null){C.items[z].cacher();return maj()}
  aller(i-1,true);
}
function aller(n,retour){
  if(n<0||n>=ctl.length||n===i)return;
  const A=ctl[i],B=ctl[n];
  const chapitre=!retour&&B.d.n&&B.d.n!==A.d.n;
  const montrer=()=>{A.s.hidden=true;B.s.hidden=false;i=n;maj();B.entree()};
  if(RM){montrer();return}
  occupe=true;
  if(chapitre||n===0||B.d.type==='fin'){
    const v=document.getElementById('volet');document.getElementById('voletNum').textContent=B.d.n||'';
    v.style.visibility='visible';
    const kf=[{transform:'translateX(-101%)'},{transform:'translateX(0)',offset:.42},{transform:'translateX(0)',offset:.58},{transform:'translateX(101%)'}];
    v.children[0].animate(kf,{duration:1150,easing:'cubic-bezier(.7,0,.3,1)'});
    const a2=v.children[1].animate(kf,{duration:1150,delay:90,easing:'cubic-bezier(.7,0,.3,1)',fill:'backwards'});
    anim(v.querySelector('b'),[{opacity:0,transform:'scale(.8)'},{opacity:1,transform:'none',offset:.5},{opacity:0,transform:'scale(1.1)'}],{duration:1150,delay:90});
    setTimeout(montrer,560);
    a2.onfinish=()=>{v.style.visibility='hidden';occupe=false};
  }else{
    const s=retour?-1:1;
    anim(A.s,[{opacity:1,transform:'none'},{opacity:0,transform:'translateX('+(-60*s)+'px)'}],{duration:320,easing:'ease-in',fill:'none'});
    setTimeout(()=>{montrer();anim(B.s,[{opacity:0,transform:'translateX('+(80*s)+'px)'},{opacity:1,transform:'none'}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)',fill:'none'});occupe=false},300);
  }
}
function maj(){
  [...pts.children].forEach((p,k)=>p.className=k<i?'ok':k===i?'ici':'');
  const C=ctl[i],d=C.d;
  document.getElementById('chap').textContent=d.n?d.n+' · '+d.rub:(d.type==='couv'?'Le menuisier':'À vous');
  const reste=C.items.some(x=>!x.el.classList.contains('vu'));
  const b=document.getElementById('suiv');
  b.textContent=d.type==='couv'?'Commencer ▶':(C.intro&&!C.docked)?'Voir les réponses ▶':reste?'Réponse suivante ▶':(i<ctl.length-1?'Diapo suivante ▶':'Terminé');
  try{history.replaceState(null,'','#'+(i+1))}catch(e){}
}
document.getElementById('suiv').onclick=()=>suivant();
document.getElementById('prec').onclick=()=>precedent();
document.getElementById('tout').onclick=()=>{const C=ctl[i];if(C.intro&&!C.docked){dock(C,true);C.ordre.push('dock')}
  C.items.forEach((x,k)=>{if(!x.el.classList.contains('vu')){C.ordre.push(k);x.montrer(false)}});maj()};
const plein=()=>{if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})};
document.getElementById('plein').onclick=plein;
document.addEventListener('fullscreenchange',()=>setTimeout(echelle,60));
addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if([' ','ArrowRight','PageDown','Enter','ArrowDown'].includes(e.key)){e.preventDefault();suivant()}
  else if(['ArrowLeft','PageUp','Backspace','ArrowUp'].includes(e.key)){e.preventDefault();precedent()}
  else if(e.key==='f'||e.key==='F')plein();
  else if(e.key==='Home'){e.preventDefault();aller(0,true)}
});

const h=parseInt(location.hash.slice(1),10);
i=(h>=1&&h<=ctl.length)?h-1:0;
ctl[i].s.hidden=false;echelle();maj();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>ctl[i].entree());
})();
</script>
